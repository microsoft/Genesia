[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "genesia"
version = "0.2.0"
description = "Evidence-grounded, agentic synthetic persona research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6", "requests>=2.31", "typer>=0.12"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
live = ["playwright>=1.48"]
media = ["opencv-python-headless>=4.10", "pypdf>=5", "python-docx>=1.1"]
demo = ["Pillow>=10.1"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "Pillow>=10.1"]

[project.scripts]
genesia = "genesia.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genesia = ["resources/*.js", "resources/*.json", "resources/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '--strict-markers -m "not browser and not media and not publication"'
markers = [
    "browser: live integrations requiring the live extra and/or local Chromium",
    "media: integrations requiring optional video or document decoders",
    "publication: repository-only audits of published datasets, reports and media",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]